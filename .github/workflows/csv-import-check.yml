name: FIRO CSV import build check

on:
  push:
    branches:
      - fix/csv-import-timeout
  pull_request:
    branches:
      - main

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
